name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Check formatting of changed files
        run: |
          git fetch origin ${{ github.base_ref || github.ref_name }} --depth 1
          CHANGED=$(git diff --name-only --diff-filter=ACM origin/${{ github.base_ref || github.ref_name }} -- '*.ts' '*.tsx' '*.css' '*.md' '*.json' '*.mjs' || true)
          if [ -n "$CHANGED" ]; then
            bunx prettier --check $CHANGED
          fi

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run docs:check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run registry:build

      - run: bun run docs:check

      - name: Verify generated registry files are committed
        run: |
          git diff --exit-code -- public/r
          test -z "$(git ls-files --others --exclude-standard -- public/r)"

      - run: bun run build
